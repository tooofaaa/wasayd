services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: wasayd-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wasayd-net

  nginx:
    image: nginx:1.27-alpine
    container_name: wasayd-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wasayd-net

  mysql:
    image: mysql:8.0
    platform: linux/arm64
    container_name: wasayd-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: wasayd_root_2024
      MYSQL_DATABASE: wasayd
      MYSQL_USER: wasayd
      MYSQL_PASSWORD: wasayd_pass_2024
    volumes:
      - wasayd-mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwasayd_root_2024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wasayd-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: wasayd-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wasayd-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wasayd-phpmyadmin
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: wasayd_root_2024
    depends_on:
      - mysql
    profiles:
      - tools
    networks:
      - wasayd-net

volumes:
  wasayd-mysql-data:
    driver: local

networks:
  wasayd-net:
    driver: bridge
