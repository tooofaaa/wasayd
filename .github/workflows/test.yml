name: Test Actions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo hello
        run: echo "Hello from GitHub Actions!"
      - name: Show secrets available
        run: |
          echo "DEPLOY_HOST is set: ${{ secrets.DEPLOY_HOST != '' }}"
          echo "DEPLOY_USER is set: ${{ secrets.DEPLOY_USER != '' }}"
          echo "DEPLOY_SSH_KEY is set: ${{ secrets.DEPLOY_SSH_KEY != '' }}"
